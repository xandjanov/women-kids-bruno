info:
  name: get all
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/user/memberships"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Profildagi "Abonementlar" bloki** — foydalanuvchining o'zi VA
  farzandlarining faol abonementlari bitta ro'yxatda.
  `userToken` bilan ishlaydi, staff tokeni bilan emas.

  Faqat `status = active` va muddati o'tmagan yozuvlar chiqadi
  (so'rov boshida server muddati o'tganlarni `expired` ga o'tkazadi).

  ```json
  {
    "items": [
      {
        "id": 1,
        "holder_name": "Malika Testova",
        "category_label": "Mening abonementim",
        "tariff_title": "Premium",
        "group": "adults",
        "days_left": 30,
        "visits_left": 12,
        "total_visits": 12,
        "expiry_date_formatted": "22-noyabr",
        "expiry_date": "2026-11-22",
        "qr_code_payload": "TKXRHNJSIAAMXVHCLZRYOXXRMK",
        "color": "#7C5CFC",
        "icon": "crown",
        "is_owner": true,
        "status": "active"
      }
    ],
    "total": 1
  }
  ```

  | Maydon | Izoh |
  |---|---|
  | `holder_name` | egasining ismi — o'zi yoki farzandi |
  | `category_label` | "Mening abonementim" / "Farzandingiz abonementi" — til bo'yicha |
  | `days_left` | bugundan `end_date` gacha qolgan kun (manfiy bo'lmaydi) |
  | `visits_left` | qolgan tashriflar; `total_visits` progress bar uchun |
  | `expiry_date_formatted` | til bo'yicha: `22-noyabr` / `22 ноября` / `22 November` |
  | `qr_code_payload` | QR kodga joylanadigan token — `check-in` shuni oladi |
  | `is_owner` | `true` — o'zinikidir, `false` — farzandiniki |

  Tartib: avval o'ziniki, keyin farzandlarniki; muddati yaqinroqlari oldinda.
