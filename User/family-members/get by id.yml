info:
  name: get by id
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/user/family-members/detail/{{family_member_id}}"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Bitta oila a'zosi — xom yozuv (`birth_date` RFC3339 ko'rinishida).

  Boshqa foydalanuvchining a'zosi so'ralsa `404` qaytadi (ID to'g'ri bo'lsa
  ham) — so'rov doim `user_id` bo'yicha cheklanadi.
