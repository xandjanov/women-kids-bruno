info:
  name: update
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/user/family-members/update/{{family_member_id}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept-Language
      value: "oz"
  body:
    type: json
    data: |-
      {
        "full_name": "Sevinch Karimova",
        "birth_date": "2018-05-14",
        "relationship": "child",
        "status": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  `UpdateFamilyMemberRequest` dagi HAMMA maydon yozilgan — keraksizini
  o'chirib yuborsangiz, o'sha maydon tegilmaydi.

  | Maydon | Cheklov |
  |---|---|
  | `full_name` | max 255 |
  | `birth_date` | `YYYY-MM-DD`; bo'sh satr (`""`) sanani tozalaydi |
  | `relationship` | `child`, `spouse`, `parent`, `other` |
  | `status` | bool — `false` a'zoni ro'yxatdan yashiradi |

  Begona a'zoni yangilash `404` qaytaradi.
