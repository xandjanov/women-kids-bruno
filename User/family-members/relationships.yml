info:
  name: relationships
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/user/family-members/relationships"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Ruxsat etilgan qarindoshlik turlari.

  ```json
  { "relationships": ["child", "spouse", "parent", "other"] }
  ```

  | Qiymat | Ma'nosi |
  |---|---|
  | `child` | farzand (standart) |
  | `spouse` | turmush o'rtog'i |
  | `parent` | ota-ona |
  | `other` | boshqa |

  `relationship` yuborilmasa yoki bo'sh bo'lsa `child` qo'yiladi.
