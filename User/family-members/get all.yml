info:
  name: get all
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/user/family-members/list"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body && res.body.items && res.body.items.length) {
          bru.setEnvVar("family_member_id", res.body.items[0].id);
        }

docs: |-
  Faqat kirgan foydalanuvchining o'z oila a'zolari, `id ASC` tartibida.
  Faqat `status: true` yozuvlar chiqadi.

  Javobdagi `age` tug'ilgan sanadan serverda hisoblanadi (`birth_date` bo'sh
  bo'lsa `0`).

  ```json
  {
    "items": [
      { "id": 1, "full_name": "Sevinch Karimova", "birth_date": "2018-05-14",
        "relationship": "child", "age": 8, "status": true }
    ],
    "total": 1
  }
  ```
