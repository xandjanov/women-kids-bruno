info:
  name: delete
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{base_url}}/user/family-members/delete/{{family_member_id}}"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Oila a'zosini o'chiradi. Topilmasa yoki begona bo'lsa `404`.

  DIQQAT: a'zoga biriktirilgan abonementlar (`user_memberships`) o'chmaydi —
  ular `holder_name` nusxasi bilan qoladi. Abonementni ham tugatmoqchi
  bo'lsangiz avval `23-UserMembership / Cancel` ni yuboring.
