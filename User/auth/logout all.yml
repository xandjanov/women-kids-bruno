info:
  name: logout all
  type: http
  seq: 12

http:
  method: POST
  url: "{{base_url}}/user/logout-all"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Boshqa hamma qurilmadan** chiqaradi — hozirgi qurilma ochiq qoladi.

  "Telefonim yo'qoldi" yoki "parolim/akkauntim birovga tushdi" holatida
  bitta tugma bilan hamma begona sessiyani uzish uchun.

  Keyin `Sessions List` ni yuborsangiz faqat bitta — `current: true`
  bo'lgan sessiya qoladi.

  `{{user_token}}` o'zgarmaydi, qayta login qilish shart emas.
