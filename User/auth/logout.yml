info:
  name: logout
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/user/logout"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Shu qurilmadagi sessiyani o'chiradi — token darhol ishlamay qoladi.
  Tekshirish uchun keyin `Profile` ni yuboring: `401` qaytishi kerak.

  Boshqa qurilmalardagi sessiyalar saqlanib qoladi.
