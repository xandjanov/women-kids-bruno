info:
  name: profile
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/user/profile"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Kirgan foydalanuvchining o'z profili. **Bu so'rov `userToken` ni ishlatadi**,
  kolleksiya darajasidagi staff tokenini EMAS — shuning uchun `Authorization`
  header'i qo'lda yozilgan.

  Avval `Register Verify` yoki `Login Verify` ni yuboring, ular
  `userToken` ni to'ldiradi.

  Javob:

  ```json
  { "id": 1, "full_name": "...", "phone": "998901234567", "img": null, "status": true, "created_at": "..." }
  ```

  | Xato | Sabab |
  |---|---|
  | `401` token yaroqsiz | token yo'q, muddati tugagan yoki logout qilingan |
  | `401` bloklangan | `status: false` |

  DIQQAT: staff tokeni bu endpointga kirmaydi, user tokeni ham admin
  endpointlariga (`/api/v1/pages/*`, `/api/v1/memberships/*`, ...) kirmaydi —
  ikki tizim bir-biridan to'liq ajratilgan.
