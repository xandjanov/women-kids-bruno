info:
  name: session revoke
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{base_url}}/user/sessions/{{user_session_id}}"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Tanlangan qurilmani tizimdan chiqaradi — **begona qurilmadan kirilgan
  bo'lsa shu bilan uzib qo'yiladi**.

  O'chirilgan sessiyaning tokeni darhol ishlamay qoladi (`401`), qolgan
  qurilmalar ta'sirlanmaydi.

  Avval `Sessions List` ni yuboring — u `userSessionId` ni
  o'ziniki bo'lmagan birinchi sessiyaga to'ldiradi.

  | Xato | Sabab |
  |---|---|
  | `404` `session_not_found` | bunday sessiya yo'q yoki **boshqa foydalanuvchiniki** |
  | `400` `invalid_id` | id raqam emas |

  O'z sessiyangizni ham o'chirish mumkin — bu `Logout` bilan bir xil natija.
