info:
  name: get all
  type: http
  seq: 1

http:
  method: GET
  url: "{{public_url}}/public/trial-offers/list"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Ochiq (token kerak emas). Faqat `status: true` yozuvlar,
  `sort_order ASC, id ASC` tartibida.

  Til `Accept-Language` bilan: oz | ru | uz | en (standart oz) — javobda
  `title`, `short_content`, `content`, `adults`, `children` bittalik maydonlar.
