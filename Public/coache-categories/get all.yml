info:
  name: get all
  type: http
  seq: 1

http:
  method: GET
  url: "{{public_url}}/public/coache-categories/list"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Ochiq (token kerak emas). Faqat `status: true` yozuvlar, `id ASC` tartibida.

  Til `Accept-Language` bilan: oz | ru | uz | en (standart oz) —
  javobda `title` shu tilda qaytadi. `status` va `created_at` ham qaytariladi.
