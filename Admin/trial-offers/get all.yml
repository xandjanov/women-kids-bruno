info:
  name: get all
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/trial-offers/list"
  headers:
    - name: Accept-Language
      value: "oz"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body && res.body.items && res.body.items.length) {
          bru.setEnvVar("trial_offer_id", res.body.items[0].id);
        }

docs: |-
  Admin ro'yxati, `sort_order ASC, id ASC` tartibida. limit: 1..100, standart 10.
  Til `Accept-Language` bo'yicha — har guruh bitta maydon bo'lib qaytadi.
  Birinchi elementning `id`si `trialOfferId` env o'zgaruvchisiga yoziladi.
