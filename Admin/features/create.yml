info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/features/create"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept-Language
      value: "oz"
  body:
    type: json
    data: |-
      {
        "group": "header",
        "title_oz": "Tezkor yetkazib berish",
        "title_ru": "Быстрая доставка",
        "title_uz": "Тезкор етказиб бериш",
        "title_en": "Fast delivery",
        "sort_order": 0,
        "status": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Yangi xususiyat yaratish. Social kabi JSON (fayl yuklamaydi, multipart EMAS).

  | Maydon | Turi | Cheklov |
  |---|---|---|
  | `group` | string | **MAJBURIY** — faqat `header` yoki `footer` |
  | `title_oz/ru/uz/en` | string | max 255, ixtiyoriy |
  | `sort_order` | int | ixtiyoriy, standart 0 |
  | `status` | bool | ixtiyoriy, standart true |

  `group` bo'sh bo'lsa yoki `header`/`footer` dan boshqa qiymat yuborilsa `400`
  qaytadi va xato matni `Accept-Language` bo'yicha tarjima bilan keladi:

  | Til | Xabar |
  |---|---|
  | oz | Guruh noto'g'ri tanlandi. Faqat: header, footer |
  | ru | Группа выбрана неверно. Только: header, footer |
  | uz | Гуруҳ нотўғри танланди. Фақат: header, footer |
  | en | Invalid group. Allowed: header, footer |

  Katta-kichik harf muhim emas: `HEADER` ham `header` sifatida saqlanadi.
