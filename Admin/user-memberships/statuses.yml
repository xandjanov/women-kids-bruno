info:
  name: statuses
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/user-memberships/statuses"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Biriktirilgan abonement holatlari.

  ```json
  { "statuses": ["active", "expired", "used_up", "cancelled"] }
  ```

  | Holat | Qachon qo'yiladi |
  |---|---|
  | `active` | biriktirilganda |
  | `expired` | `end_date` o'tganda — server ro'yxat/profil so'rovida avtomatik qo'yadi |
  | `used_up` | oxirgi tashrif yechilganda (`remaining_visits` 0 ga tushganda) |
  | `cancelled` | admin `cancel` qilganda |

  Shu qiymatlar `list` so'rovining `?status=` filtrida ishlatiladi.
