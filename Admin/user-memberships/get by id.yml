info:
  name: get by id
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/user-memberships/detail/{{user_membership_id}}"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Bitta biriktirilgan abonement — `List` dagi bilan bir xil maydonlar.
  Topilmasa `404` (`user_membership_not_found`), id raqam bo'lmasa `400`.
