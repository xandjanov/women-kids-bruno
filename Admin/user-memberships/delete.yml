info:
  name: delete
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{base_url}}/user-memberships/delete/{{user_membership_id}}"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Biriktirilgan abonementni butunlay o'chiradi. Topilmasa `404`.

  Odatda o'chirish kerak emas — `Cancel` tarixni saqlab qoladi.
  O'chirilganda `attendance_logs` dagi yozuvlar qoladi, lekin ular endi
  mavjud bo'lmagan `user_membership_id` ga ishora qiladi.
