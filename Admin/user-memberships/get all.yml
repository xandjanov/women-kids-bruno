info:
  name: get all
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/user-memberships/list?user_id={{user_id}}"
  headers:
    - name: Accept-Language
      value: oz
  params:
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: user_id
      value: "{{user_id}}"
      type: query
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: status
      value: active
      type: query
      disabled: true
    - name: status
      value: expired
      type: query
      disabled: true
    - name: status
      value: used_up
      type: query
      disabled: true
    - name: status
      value: cancelled
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body && res.body.items && res.body.items.length) {
          bru.setEnvVar("user_membership_id", res.body.items[0].id);
          bru.setEnvVar("qr_code_token", res.body.items[0].qr_code_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Admin uchun biriktirilgan abonementlar ro'yxati, `id DESC` tartibida.
  limit: 1..100, standart 10.

  | Filtr | Ma'nosi |
  |---|---|
  | `user_id` | bitta foydalanuvchining abonementlari |
  | `status` | `active`, `expired`, `used_up`, `cancelled` (noto'g'ri qiymat 400) |

  Ikkala filtr `~` bilan o'chirilgan — kerakligining checkbox'ini belgilang,
  `status` dan faqat bittasi yoqilgan bo'lsin.

  So'rov boshida server muddati o'tgan `active` yozuvlarni avtomatik
  `expired` ga o'tkazadi, shuning uchun ro'yxat doim haqiqiy holatni ko'rsatadi.

  Birinchi elementning `id` va `qr_code_token` qiymatlari `userMembershipId`
  va `qrCodeToken` env o'zgaruvchilariga yoziladi — `Check-In` shuni oladi.
