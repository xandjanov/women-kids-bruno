info:
  name: get all
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/memberships/list"
  headers:
    - name: Accept-Language
      value: "oz"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: group
      value: "adults"
      type: query
      disabled: true
    - name: group
      value: "kids"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body && res.body.items && res.body.items.length) {
          bru.setEnvVar("membership_id", res.body.items[0].id);
        }

docs: |-
  Admin ro'yxati, `sort_order ASC, id ASC` tartibida. limit: 1..100, standart 10.

  `group` filtri `~` bilan o'chirilgan — hamma tarif chiqadi. Kerakli guruhning
  checkbox'ini belgilasangiz (`adults` yoki `kids`) faqat o'sha guruh qoladi.
  Noto'g'ri qiymat `400` qaytaradi.

  Til `Accept-Language` bo'yicha — `title` va `short_content` bitta maydon
  bo'lib qaytadi; `price`, `validity_days`, `total_visits` o'zgarmaydi.

  Birinchi elementning `id`si `membershipId` env o'zgaruvchisiga yoziladi —
  `Assign` va `Detail` so'rovlari shuni ishlatadi.
