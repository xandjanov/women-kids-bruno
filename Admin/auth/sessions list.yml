info:
  name: sessions list
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/auth/sessions"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body && res.body.items && res.body.items.length) {
          bru.setEnvVar("session_id", res.body.items[0].id);
        }

docs: |-
  Joriy staff'ning aktiv qurilmalari — Telegram'dagi "Active Sessions" kabi.

  **Bir qurilma = bitta qator.** O'sha brauzer/telefondan necha marta login
  qilinsa ham ro'yxat o'smaydi: eski sessiya yangisi bilan almashtiriladi.

  Har bir element:

  | Maydon | Nima |
  |---|---|
  | `id` | sessiyani o'chirish uchun ID (Session Revoke) |
  | `device_name` | "iPhone 15 Pro" yoki "Chrome 141 / Windows" |
  | `platform` | `web` / `android` / `ios` |
  | `ip` | oxirgi login IP'si |
  | `user_agent` | xom User-Agent |
  | `current` | shu token bilan ochilgan sessiya (aynan bittasi `true`) |
  | `last_seen_at` | oxirgi faollik (5 daqiqada bir yangilanadi) |
  | `created_at` | qurilma qachon login qilgan |
  | `expires_at` | token qachon tugaydi (24 soat) |

  Tartib: `last_seen_at` bo'yicha kamayish tartibida — eng aktiv qurilma yuqorida.
  Muddati o'tgan sessiyalar ro'yxatga tushmaydi.

  Birinchi elementning `id`si avtomatik `sessionId` env o'zgaruvchisiga yoziladi.
