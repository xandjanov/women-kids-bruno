info:
  name: get all staff
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/admin/staff/list"
  headers:
    - name: Accept-Language
      value: "oz"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Staff ro'yxati (sahifalangan). Faqat superadmin.
  limit: 1..100, standart 10.
