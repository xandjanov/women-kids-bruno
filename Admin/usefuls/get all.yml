info:
  name: get all
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/usefuls/list"
  headers:
    - name: Accept-Language
      value: "oz"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body && res.body.items && res.body.items.length) {
          bru.setEnvVar("useful_id", res.body.items[0].id);
        }

docs: |-
  Admin ro'yxati, `sort_order ASC, id ASC` tartibida. limit: 1..100, standart 10.

  `files` da faqat ASOSIY rasm (`is_main: true`) qaytadi — ro'yxat miniatyurasi uchun.
  Hamma rasm kerak bo'lsa Detail so'rovidan oling.
  Birinchi elementning `id`si `usefulId` env o'zgaruvchisiga yoziladi.
