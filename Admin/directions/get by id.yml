info:
  name: get by id
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/directions/detail/{{direction_id}}"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  ID bo'yicha bitta yozuv — admin uchun HAMMA til maydonlari bilan
  (`title_*`, `short_content_*`, `age_*` to'rt tilda), `week` massivi
  va hamma fayllari bilan.
  Topilmasa 404, id raqam bo'lmasa 400.
