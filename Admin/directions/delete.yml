info:
  name: delete
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{base_url}}/directions/delete/{{direction_id}}"
  headers:
    - name: Accept-Language
      value: "oz"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Yozuvni va uning hamma rasmlarini butunlay o'chiradi — fayllar diskdan ham ketadi.
  Admin yoki superadmin tokeni yetarli.
  Yozuv topilmasa tarjimali 404.
