      - name: address_ru
        type: text
        value: "г. Ташкент, улица Амира Темура 1"
      - name: address_uz
        type: text
        value: "Тошкент ш., Амир Темур кўчаси 1"
      - name: address_en
        type: text
        value: "Tashkent, Amir Temur street 1"
      - name: inner_link
        type: text
        value: "/about-us"
      - name: external_link
        type: text
        value: ""
      - name: link
        type: text
        value: "https://menu.example.uz"
      - name: meta_title_oz
        type: text
        value: "Biz haqimizda"
      - name: meta_title_ru
        type: text
        value: "О нас"
      - name: meta_title_uz
        type: text
        value: "Биз ҳақимизда"
      - name: meta_title_en
        type: text
        value: "About us"
      - name: meta_description_oz
        type: text
        value: "Biz haqimizda sahifasi"
      - name: meta_description_ru
        type: text
        value: "Страница о нас"
      - name: meta_description_uz
        type: text
        value: "Биз ҳақимизда саҳифаси"
      - name: meta_description_en
        type: text
        value: "About us page"
      - name: meta_keywords_oz
        type: text
        value: "biz, haqimizda"
      - name: meta_keywords_ru
        type: text
        value: "о нас, компания"
      - name: meta_keywords_uz
        type: text
        value: "биз, ҳақимизда"
      - name: meta_keywords_en
        type: text
        value: "about, us"
      - name: slug
        type: text
        value: "biz-haqimizda"
      - name: sort_order
        type: text
