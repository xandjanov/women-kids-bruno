      - name: short_content_oz
        type: text
        value: "Menyu uchun qisqa matn"
      - name: short_content_ru
        type: text
        value: "Короткий текст для меню"
      - name: short_content_uz
        type: text
        value: "Меню учун қисқа матн"
      - name: short_content_en
