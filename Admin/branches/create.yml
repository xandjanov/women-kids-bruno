info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/branches/create"
  headers:
    - name: Accept-Language
      value: "oz"
  body:
    type: multipart-form
    data:
      - name: title_oz
        type: text
        value: "Chilonzor filiali"
      - name: title_ru
        type: text
        value: "Филиал Чиланзар"
      - name: title_uz
        type: text
        value: "Чилонзор филиали"
      - name: title_en
        type: text
        value: "Chilonzor branch"
      - name: short_content_oz
        type: text
        value: "Chilonzor tumanidagi asosiy filial"
      - name: short_content_ru
        type: text
        value: "Главный филиал в Чиланзарском районе"
      - name: short_content_uz
        type: text
        value: "Чилонзор туманидаги асосий филиал"
      - name: short_content_en
        type: text
        value: "Main branch in Chilonzor district"
      - name: address_oz
        type: text
        value: "Toshkent sh., Chilonzor 9-kvartal, 12-uy"
      - name: address_ru
        type: text
        value: "г. Ташкент, Чиланзар 9-квартал, дом 12"
      - name: address_uz
        type: text
        value: "Тошкент ш., Чилонзор 9-квартал, 12-уй"
      - name: address_en
        type: text
        value: "Tashkent, Chilonzor 9th block, house 12"
      - name: hall_oz
        type: text
        value: "3 ta zal"
      - name: hall_ru
        type: text
        value: "3 зала"
      - name: hall_uz
        type: text
        value: "3 та зал"
      - name: hall_en
        type: text
        value: "3 halls"
      - name: link
        type: text
        value: "https://maps.google.com/?q=41.2995,69.2401"
      - name: sort_order
        type: text
        value: "0"
      - name: status
        type: text
        value: "true"
      - name: files
        type: file
        value: []
        disabled: true
      - name: lang
        type: text
        value: "oz"
        disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **multipart/form-data** — Branch'da `Files` bor, shuning uchun create JSON EMAS.

  | Maydon | Turi | Cheklov |
  |---|---|---|
  | `title_oz/ru/uz/en` | matn | max 255 |
  | `short_content_oz/ru/uz/en` | matn | cheklovsiz (text) |
  | `address_oz/ru/uz/en` | matn | max 255 |
  | `hall_oz/ru/uz/en` | matn | max 255 |
  | `link` | matn | cheklovsiz (masalan xarita havolasi) |
  | `sort_order` | int | standart 0 |
  | `status` | bool | standart true |
  | `files` | fayl | jpg/jpeg/png/webp, har biri max 5MB, 100 tagacha |
  | `lang` | matn | har bir faylga til (oz\|ru\|uz\|en\|all) — FAYL SONI BILAN TENG bo'lishi shart |

  Hamma matn maydoni ixtiyoriy. Fayl maydonlari `~` bilan o'chirilgan —
  so'rov fayl bo'lmasa ham ishlaydi, yoqish uchun Bruno'da checkbox'ni belgilang.

  Keyinchalik rasm qo'shish/o'chirish uchun `11-Media` papkasidan foydalaning
  (`table` = `branches`).
