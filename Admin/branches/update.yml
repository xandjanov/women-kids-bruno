info:
  name: update
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base_url}}/branches/update/{{branch_id}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Accept-Language
      value: "oz"
  body:
    type: json
    data: |-
      {
        "title_oz": "Chilonzor filiali (yangilangan)",
        "title_ru": "Филиал Чиланзар (обновлено)",
        "title_uz": "Чилонзор филиали (янгиланган)",
        "title_en": "Chilonzor branch (updated)",
        "short_content_oz": "Yangilangan qisqa matn",
        "short_content_ru": "Обновлённый короткий текст",
        "short_content_uz": "Янгиланган қисқа матн",
        "short_content_en": "Updated short text",
        "link": "https://maps.google.com/?q=41.3111,69.2797",
        "address_oz": "Toshkent sh., Yangi manzil 5",
        "address_ru": "г. Ташкент, Новый адрес 5",
        "address_uz": "Тошкент ш., Янги манзил 5",
        "address_en": "Tashkent, New address 5",
        "hall_oz": "5 ta zal",
        "hall_ru": "5 залов",
        "hall_uz": "5 та зал",
        "hall_en": "5 halls",
        "sort_order": 1,
        "status": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  JSON (multipart EMAS). `UpdateBranchRequest` dagi HAMMA maydon yozilgan —
  keraksizini o'chirib yuborsangiz, o'sha maydon tegilmaydi.

  | Maydon guruhi | Cheklov |
  |---|---|
  | `title_oz/ru/uz/en` | max 255 |
  | `short_content_oz/ru/uz/en` | cheklovsiz (text) |
  | `address_oz/ru/uz/en` | max 255 |
  | `hall_oz/ru/uz/en` | max 255 |
  | `link` | cheklovsiz (text) |
  | `sort_order` | int |
  | `status` | bool |

  Bo'sh satr (`""`) yuborilsa maydon tozalanadi.
  Fayl qo'shish/o'chirish uchun `11-Media` papkasi (`table` = `branches`).
