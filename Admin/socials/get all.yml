info:
  name: get all
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/socials/list"
  headers:
    - name: Accept-Language
      value: "oz"
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "10"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body && res.body.items && res.body.items.length) {
          bru.setEnvVar("social_id", res.body.items[0].id);
        }

docs: |-
  Admin ro'yxati, `sort_order ASC, id ASC` tartibida. limit: 1..100, standart 10.

  Til `Accept-Language` bo'yicha — har element bitta `title` va bitta
  `short_content` maydoni bilan qaytadi, `icon`, `options`, `link` ham bor.
  Birinchi elementning `id`si `socialId` env o'zgaruvchisiga yoziladi.
